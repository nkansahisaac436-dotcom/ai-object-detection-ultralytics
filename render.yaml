services:
  - type: web
    name: ai-object-detection-ultralytics
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r webapp/requirements.txt"
    startCommand: "uvicorn main:app --app-dir webapp --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PATH
        value: webapp/model/best.pt
